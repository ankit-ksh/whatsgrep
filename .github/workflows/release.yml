name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    asset: whatsgrep-linux-x64,    file: whatsgrep }
          - { os: ubuntu-24.04-arm, asset: whatsgrep-linux-arm64,  file: whatsgrep }
          - { os: macos-15-intel,   asset: whatsgrep-macos-x64,    file: whatsgrep }
          - { os: macos-latest,     asset: whatsgrep-macos-arm64,  file: whatsgrep }
          - { os: windows-latest,   asset: whatsgrep-windows-x64.exe, file: whatsgrep.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }   # the official Node binary is what gets embedded
      - run: npm ci
      - run: npm run build
      - name: Smoke test the executable
        shell: bash
        run: |
          exe=./dist/${{ matrix.file }}
          $exe --version
          $exe -c smoke.yaml -d smoke-data config init
          $exe -c smoke.yaml -d smoke-data rules list
          $exe -c smoke.yaml -d smoke-data check "free pickup"
          $exe -c smoke.yaml -d smoke-data config set notifications desktop
      - name: Name the asset and checksum it
        shell: bash
        run: |
          mv dist/${{ matrix.file }} dist/${{ matrix.asset }}
          cd dist && (sha256sum ${{ matrix.asset }} 2>/dev/null || shasum -a 256 ${{ matrix.asset }}) > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "whatsgrep ${GITHUB_REF_NAME}" \
            --notes-file <(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md) \
            --verify-tag
