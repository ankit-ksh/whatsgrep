<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>whatsgrep</title>
<meta name="theme-color" content="#e8edf4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="whatsgrep">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="btn ghost icon back" id="back" aria-label="Back" hidden></button>
    <div class="brand"><span class="mark" id="mark"></span><b id="title">whatsgrep</b></div>
    <span class="tstatus" id="status" hidden><span class="d"></span><span id="statustext"></span></span>
  </header>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabs" hidden>
  <button data-tab="alerts"></button>
  <button data-tab="computers"></button>
</nav>
<div class="scan" id="scan" hidden>
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <p class="scanmsg" id="scanmsg"></p>
  <button class="btn" id="scanalt">Use the code instead</button>
  <button class="btn icon scanx" id="scanclose" aria-label="Close"></button>
</div>
<div class="toast" id="toast" hidden></div>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
